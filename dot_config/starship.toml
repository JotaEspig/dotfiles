"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_bg0)\
$os\
$username\
[](bg:color_bg1 fg:color_bg0)\
$directory\
[](fg:color_bg1 bg:color_bg2)\
$git_branch\
$git_status\
[](fg:color_bg2 bg:color_bg3)\
$python\
$nodejs\
$java\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'kali_dark'

[palettes.kali_dark]
color_fg = '#E6E6E6'
color_bg0 = '#0A0A0A'
color_bg1 = '#1A1A1A'
color_bg2 = '#262626'
color_bg3 = '#333333'
color_red = '#FF3B3B'
color_blue = '#5FAFFF'
color_gray = '#888888'

[os]
disabled = false
style = "bg:color_bg0 fg:color_red"

[os.symbols]
Arch = "󰣇"  # keep Arch

[username]
show_always = true
style_user = "bg:color_bg0 fg:color_fg"
style_root = "bg:color_bg0 fg:color_red"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg bg:color_bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol $branch ](fg:color_blue bg:color_bg2)]($style)'

[git_status]
style = "bg:color_bg2"
format = '[[($all_status$ahead_behind )](fg:color_red bg:color_bg2)]($style)'

[python]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg3)]($style)'

[nodejs]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg3)]($style)'

[java]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_gray bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[➜](bold fg:color_blue)'
error_symbol = '[➜](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_blue)'
vimcmd_replace_one_symbol = '[](bold fg:color_red)'
vimcmd_replace_symbol = '[](bold fg:color_red)'
vimcmd_visual_symbol = '[](bold fg:color_gray)'
